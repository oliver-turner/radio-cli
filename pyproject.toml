[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-cli"
version = "1.0.0"
description = "A simple terminal radio player for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyradios>=2.0",
    "pydantic>=2.0",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback; sys_platform == 'win32'",
    "textual>=8.2.8",
]

[project.scripts]
radio = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.uv]
required-version = ">=0.5.0"
